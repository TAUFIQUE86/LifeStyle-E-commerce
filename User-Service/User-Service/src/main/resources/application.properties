spring.application.name=User-Service
# Service Configuration
server.port=8081


# Database Configuration (Update with your credentials)
#spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_user_db?useSSL=false
#spring.datasource.url=jdbc:mysql://localhost:3306/lifestyle-ecommerce_user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator Configuration for Spring Boot Admin
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true


# You can provide a fallback default value after the colon (e.g., for local development)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lifestyle-ecommerce_user_db?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}

# No default value provided here; the app will fail to start if DB_PASSWORD is not set
spring.datasource.password=${DB_PASSWORD}

# Local-development fallback only. Override JWT_SECRET with a unique value in every deployed environment.
app.jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-before-production!}
app.jwt.expiration=PT1H
