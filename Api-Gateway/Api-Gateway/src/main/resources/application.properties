spring.application.name=Api-Gateway
server.port=9090

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://User-Service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://Product-Service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/products/**

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Local-development fallback only. Override JWT_SECRET with a unique value in every deployed environment.
app.jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-before-production!}
