spring.application.name=Product-Service
server.port=8082

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Connects to your local MongoDB and creates 'ecommerce_product_db' automatically
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/ecommerce_product_db}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Local-development fallback only. Override JWT_SECRET with a unique value in every deployed environment.
app.jwt.secret=${JWT_SECRET:local-development-jwt-secret-change-before-production!}
