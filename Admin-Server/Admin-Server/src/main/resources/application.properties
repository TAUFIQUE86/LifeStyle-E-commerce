spring.application.name=Admin-Server
server.port=1111



# Expose all Actuator endpoints over HTTP (Required for Admin Server functionality)
management.endpoints.web.exposure.include=*

# Always show full details for the /health endpoint
management.endpoint.health.show-details=always

# (Optional) If you are using the Eureka Server from your previous step,
# add this so the Admin Server automatically discovers your microservices:
# eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/